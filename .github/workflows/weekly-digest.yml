name: Weekly Digest

on:
  schedule:
    # Every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Report delivery-state limitations
        run: |
          echo "::warning::Delivery state is temporary on this runner. Cross-run duplicate protection relies on reusing the same Resend idempotency key within its 24-hour retention period. Reconcile prior delivery before retrying after expiry."
          printf '%s\n' \
            '### Delivery-state retention' \
            'This workflow does not retain sent/pending records across jobs. Resend protects the same idempotency key for 24 hours only; a new local date creates a different digest window and key.' \
            'Reconcile prior delivery before retrying after key expiry. Use the container with its persistent state volume for durable delivery history.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Send weekly digest
        run: bun run src/index.ts
        env:
          NODE_ENV: production
          # Required
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          # Optional
          # Job-local only; cross-run protection is limited to Resend's key retention.
          STATE_DIR: ${{ runner.temp }}/taskovo-state
          TIMEZONE: ${{ vars.TIMEZONE }}
          DIGEST_EMAIL_BLACKLIST: ${{ vars.DIGEST_EMAIL_BLACKLIST }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          # LLM (optional — skipped if LLM_BASE_URL is not set)
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          # Weather (optional)
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION }}
          WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
          # F1 (optional)
          F1_SCHEDULE: ${{ vars.F1_SCHEDULE }}
          # Local events (optional)
          EVENTS_ENABLED: ${{ vars.EVENTS_ENABLED }}
          EVENTS_DISTRICT: ${{ vars.EVENTS_DISTRICT }}
